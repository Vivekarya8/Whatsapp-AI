name: Align cafe context

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align WhatsApp AI cafe facts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.js')
          s = p.read_text()
          old = '''--- Cafe details (edit this with your real info) ---\nHours: 11 AM - 11 PM, all days\nGames available: PS5, PC gaming (Valorant, FIFA, GTA V), pool table\nPricing: PS5 - Rs 150/hour, PC - Rs 100/hour, Pool - Rs 200/hour\nLocation: [your cafe address]'''
          new = '''--- Cafe details ---\nHours: 9 AM - 1 AM, all days\nStations and pricing: PC Gaming Bay - Rs 90/hour; Console Zone - Rs 80/hour; VR Arena - Rs 150/hour; Squad Room - Rs 350/hour\nLocation: C5, Block C, Nandgram, Ghaziabad, Uttar Pradesh'''
          if old not in s:
              raise SystemExit('Expected stale cafe context was not found; aborting.')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/align-cafe-context.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js .github/workflows/align-cafe-context.yml
          git commit -m "Align WhatsApp cafe facts with website"
          git push
